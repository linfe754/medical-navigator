name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t medical-navigator:ci .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login
        run: az account show --output table

      - name: Login to ACR
        run: az acr login --name medicalnavigator754

      - name: Build and push Docker image
        run: |
          docker build \
            -t medicalnavigator754.azurecr.io/medical-navigator:${{ github.sha }} \
            .
          docker push \
            medicalnavigator754.azurecr.io/medical-navigator:${{ github.sha }}

[project]
name = "medical-navigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.4.6",
    "openai>=3.11.0",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
eval = [
    "rank-bm25>=0.2.2",
]
ingestion = [
    "docling>=2.142.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: tests that call external APIs and may incur cost",
]
addopts = "-m 'not live'"
